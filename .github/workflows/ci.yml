name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: pytest --cov=app --cov-fail-under=85 --cov-report=term-missing
      - name: Verify sample is reproducible
        run: |
          PYTHONPATH=. python scripts/build_sample.py
          git diff --exit-code examples/sample-response.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check src e2e scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t aperture:test .
      - name: Smoke test production server and UI
        run: |
          docker run -d --name aperture-test -p 4000:4000 aperture:test
          for i in $(seq 1 20); do
            curl -fsS http://localhost:4000/health && break
            sleep 2
          done
          curl -fsS http://localhost:4000/health | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl -fsS http://localhost:4000/ | grep -q 'Aperture'
          curl -fsS http://localhost:4000/openapi.json | python -c 'import json,sys; assert "/link-analysis" in json.load(sys.stdin)["paths"]'
      - name: Logs on failure
        if: failure()
        run: docker logs aperture-test || true
