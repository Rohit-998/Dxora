[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_sample.py" = ["E501"]
"tests/test_extraction.py" = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]
